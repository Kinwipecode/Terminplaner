<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminplanung</title>
<meta name="description" content="Terminplanung – Projektplanung im Browser: Gantt, Tabelle, Kalender, Board. Speichert automatisch in eine Projektdatei.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Crect x='7' y='9' width='12' height='4' rx='2' fill='white'/%3E%3Crect x='12' y='16' width='13' height='4' rx='2' fill='white' opacity='.75'/%3E%3Crect x='9' y='23' width='8' height='4' rx='2' fill='white' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-view="gantt">

<!-- ══════════ Startbildschirm ══════════ -->
<div id="welcome" class="welcome">
  <div class="welcome-card">
    <div class="welcome-logo">
      <svg viewBox="0 0 32 32" width="40" height="40"><rect width="32" height="32" rx="8" fill="currentColor"/><rect x="7" y="9" width="12" height="4" rx="2" fill="#fff"/><rect x="12" y="16" width="13" height="4" rx="2" fill="#fff" opacity=".75"/><rect x="9" y="23" width="8" height="4" rx="2" fill="#fff" opacity=".5"/></svg>
    </div>
    <h1>Terminplanung</h1>
    <p class="welcome-sub">Projektpläne im Browser – Gantt, Tabelle, Kalender und Board. Alles wird automatisch gespeichert.</p>

    <div id="resume-box" class="resume-box" hidden>
      <div class="resume-icon">↻</div>
      <div class="resume-text">
        <strong id="resume-title">Letztes Projekt fortsetzen</strong>
        <span id="resume-path" class="muted"></span>
      </div>
      <button id="resume-btn" class="btn btn-primary">Fortsetzen</button>
    </div>

    <div class="welcome-actions">
      <button id="w-start" class="btn btn-primary btn-lg">
        <span class="btn-ico">＋</span> Neues Projekt anlegen
        <small>Ordner wählen, Projektdatei wird dort angelegt und automatisch gespeichert</small>
      </button>
      <button id="w-open" class="btn btn-lg">
        <span class="btn-ico">📂</span> Vorhandene Projektdatei öffnen
        <small>Ordner wählen und Projekt aus der Liste auswählen</small>
      </button>
      <button id="w-import" class="btn btn-lg">
        <span class="btn-ico">⤓</span> Datei importieren
        <small>.tplan.json von der Festplatte einlesen (auch per Drag &amp; Drop)</small>
      </button>
      <button id="w-demo" class="btn btn-lg">
        <span class="btn-ico">★</span> Beispielprojekt ansehen
        <small>Zum Ausprobieren – ohne Ordner, Speicherung im Browser</small>
      </button>
    </div>

    <div class="welcome-foot">
      <span id="capability-note" class="muted"></span>
      <button class="linkbtn" data-action="help">Kurzanleitung</button>
    </div>
  </div>
</div>

<!-- ══════════ App ══════════ -->
<div id="app" class="app" hidden>

  <!-- Kopfzeile -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="24" height="24"><rect width="32" height="32" rx="8" fill="currentColor"/><rect x="7" y="9" width="12" height="4" rx="2" fill="#fff"/><rect x="12" y="16" width="13" height="4" rx="2" fill="#fff" opacity=".75"/><rect x="9" y="23" width="8" height="4" rx="2" fill="#fff" opacity=".5"/></svg>
    </div>
    <input id="project-title" class="project-title" value="Unbenanntes Projekt" spellcheck="false" title="Projektname (wird als Dateiname verwendet)">

    <div class="topbar-center">
      <div id="save-state" class="save-state" title="Speicherstatus">
        <span class="dot"></span><span id="save-text">Bereit</span>
      </div>
      <button id="storage-chip" class="chip" title="Speicherort ändern">…</button>
    </div>

    <div class="topbar-actions">
      <button class="iconbtn" data-action="undo" title="Rückgängig (Strg+Z)">↶</button>
      <button class="iconbtn" data-action="redo" title="Wiederholen (Strg+Y)">↷</button>
      <span class="sep"></span>
      <button class="iconbtn" data-action="new" title="Neues Projekt (Strg+N)">＋</button>
      <button class="iconbtn" data-action="open" title="Projekt öffnen (Strg+O)">📂</button>
      <button class="iconbtn" data-action="save-now" title="Jetzt speichern (Strg+S)">💾</button>
      <button class="iconbtn" data-action="export" title="Als Datei herunterladen">⤓</button>
      <span class="sep"></span>
      <button class="iconbtn" data-action="help" title="Kurzanleitung (F1)">?</button>
      <button class="iconbtn" data-action="theme" title="Hell/Dunkel">◐</button>
    </div>
  </header>

  <!-- Navigationsleiste links -->
  <nav class="rail">
    <button class="railbtn is-active" data-view="gantt" title="Gantt (1)"><span class="ri">▤</span><span class="rl">Gantt</span></button>
    <button class="railbtn" data-view="table" title="Tabelle (2)"><span class="ri">☰</span><span class="rl">Tabelle</span></button>
    <button class="railbtn" data-view="calendar" title="Kalender (3)"><span class="ri">▦</span><span class="rl">Kalender</span></button>
    <button class="railbtn" data-view="board" title="Board (4)"><span class="ri">▥</span><span class="rl">Board</span></button>
    <div class="rail-spacer"></div>
    <button class="railbtn" data-action="resources" title="Ressourcen / Beteiligte"><span class="ri">☺</span><span class="rl">Team</span></button>
    <button class="railbtn" data-action="project-settings" title="Projekt-Einstellungen"><span class="ri">⚙</span><span class="rl">Setup</span></button>
  </nav>

  <!-- Werkzeugleiste -->
  <div class="toolbar">
    <button class="btn btn-accent" data-action="add-task" title="Neue Aufgabe (Einfg)">＋ Aufgabe</button>
    <button class="btn" data-action="add-milestone" title="Neuer Meilenstein">◆ Meilenstein</button>
    <button class="btn" data-action="add-group" title="Neue Sammelaufgabe">⊞ Sammelaufgabe</button>
    <span class="sep"></span>

    <label class="toggle" title="Nachfolger automatisch mitverschieben (wie MS Project)">
      <input type="checkbox" id="auto-plan" checked><span class="track"></span><span>Auto-Planung</span>
    </label>
    <label class="toggle" title="Kritischen Pfad hervorheben">
      <input type="checkbox" id="show-critical"><span class="track"></span><span>Kritischer Pfad</span>
    </label>
    <label class="toggle" title="Abhängigkeitspfeile anzeigen">
      <input type="checkbox" id="show-deps" checked><span class="track"></span><span>Abhängigkeiten</span>
    </label>

    <span class="sep"></span>
    <div class="segmented" id="zoom-group" title="Zeitraster">
      <button data-zoom="day">Tag</button>
      <button data-zoom="week" class="is-active">Woche</button>
      <button data-zoom="month">Monat</button>
      <button data-zoom="quarter">Quartal</button>
    </div>
    <button class="btn" data-action="fit" title="Zeitraum einpassen">⤢ Einpassen</button>

    <span class="sep"></span>
    <div class="search">
      <span class="search-ico">⌕</span>
      <input id="filter-text" type="search" placeholder="Aufgaben filtern…" autocomplete="off">
    </div>
    <select id="filter-assignee" class="mini" title="Nach Person filtern"><option value="">Alle Personen</option></select>
    <select id="filter-status" class="mini" title="Nach Status filtern">
      <option value="">Alle Status</option>
      <option value="open">Offen</option>
      <option value="running">Läuft</option>
      <option value="blocked">Blockiert</option>
      <option value="done">Erledigt</option>
    </select>
    <button class="btn" data-action="clear-filter" title="Filter zurücksetzen">✕</button>
  </div>

  <!-- Hauptbereich -->
  <main class="workspace">
    <section class="view" id="view-gantt"></section>
    <section class="view" id="view-table" hidden></section>
    <section class="view" id="view-calendar" hidden></section>
    <section class="view" id="view-board" hidden></section>

    <aside class="detail" id="detail" hidden></aside>
  </main>

  <!-- Statuszeile -->
  <footer class="statusbar">
    <span id="stat-count">0 Aufgaben</span>
    <span class="sep"></span>
    <span id="stat-range">–</span>
    <span class="sep"></span>
    <span id="stat-progress">0 % erledigt</span>
    <span class="rail-spacer"></span>
    <span id="stat-file" class="muted">keine Datei</span>
  </footer>
</div>

<!-- Overlays -->
<div id="modal-host" class="modal-host" hidden></div>
<div id="toasts" class="toasts"></div>
<div id="drop-hint" class="drop-hint" hidden><div>Projektdatei hier ablegen, um sie zu öffnen</div></div>
<input type="file" id="file-input" accept=".json,.tplan,application/json" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
