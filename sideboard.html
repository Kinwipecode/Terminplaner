<!DOCTYPE html>
<html lang="de" data-theme="nacht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideen-Sammelbecken – Terminplanung</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314b8a6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='12' height='3' rx='1.5' fill='white' opacity='.8'/%3E%3Crect x='8' y='21' width='14' height='3' rx='1.5' fill='white' opacity='.6'/%3E%3C/svg%3E">
<script>
  try {
    var t = localStorage.getItem('tplan.theme');
    if (t) document.documentElement.dataset.theme = (t === 'dark' ? 'nacht' : t === 'light' ? 'hell' : t);
  } catch (e) { /* egal */ }
</script>
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sideboard.css">
</head>
<body class="sideboard">

<header class="sb-head">
  <div class="sb-brand">
    <span class="sb-ico">✎</span>
    <div>
      <h1>Ideen-Sammelbecken</h1>
      <div class="sb-sub" id="sb-project">kein Projekt verbunden</div>
    </div>
  </div>
  <div class="sb-head-actions">
    <span id="sb-conn" class="chip" title="Verbindung zum Hauptfenster">prüfe…</span>
    <button class="iconbtn" data-sb="theme" title="Farblayout wie im Hauptfenster">◐</button>
  </div>
</header>

<div class="sb-note" id="sb-note">
  Aufgaben hier einfach aufschreiben – <b>ohne Termin</b>. Dann mit der Maus ins Planungsfenster
  ziehen (oder anklicken und im Plan ablegen). Der Eintrag bleibt erhalten und kann mehrfach
  eingeplant werden; wie oft, steht in Klammern.
</div>

<div class="sb-tabs">
  <button class="sb-tab is-active" data-scope="project">Projekt-Sammelbecken</button>
  <button class="sb-tab" data-scope="global">Allgemeiner Vorrat</button>
</div>

<div class="sb-add">
  <input id="sb-input" type="text" placeholder="Neue Idee aufschreiben… (Eingabe fügt hinzu)" autocomplete="off">
  <button class="btn btn-accent" id="sb-add-btn">＋</button>
</div>

<div class="sb-toolbar">
  <label class="toggle" title="Erledigte Ideen ausblenden">
    <input type="checkbox" id="sb-hide-done"><span class="track"></span><span>Erledigte ausblenden</span>
  </label>
  <span class="rail-spacer"></span>
  <span class="sb-count hint" id="sb-count"></span>
</div>

<main class="sb-list" id="sb-list"></main>

<footer class="sb-foot">
  <span class="hint" id="sb-hint">Bereit.</span>
  <span class="rail-spacer"></span>
  <button class="btn" data-sb="open-main" title="Planungsfenster öffnen">Hauptfenster öffnen</button>
</footer>

<script type="module" src="js/sideboard.js"></script>
</body>
</html>
